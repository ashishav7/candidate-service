# Optional: PostgreSQL for the "postgres" profile.  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: candidates
      POSTGRES_USER: candidates
      POSTGRES_PASSWORD: candidates
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
