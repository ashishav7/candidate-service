spring.application.name=candidate-service

# --- Persistence: file-based H2 by default so the app runs with zero setup and data survives restarts.
# Use `--spring.profiles.active=postgres` for PostgreSQL (see application-postgres.properties).
spring.datasource.url=jdbc:h2:file:./data/candidates
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
# Schema is owned by Flyway migrations, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# --- Web
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
server.error.include-message=never
server.error.include-stacktrace=never

# --- Ops
management.endpoints.web.exposure.include=health,info
logging.pattern.level=%5p [%X{requestId:-}]
logging.level.com.candidatehub=INFO
